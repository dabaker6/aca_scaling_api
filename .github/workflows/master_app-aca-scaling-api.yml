# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: app-aca-scaling-api - Build and deploy container app to Azure Web App

on:
  push:
    branches:
      - master
    tags:
      - api-*
 
permissions:
      id-token: write #Azure OIDC login
      contents: read #This is required for actions/checkout
      packages: write #push to GHCR

env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}-api      
      IMAGE_TAG: v1.${{ github.sha }}
      
      WEBAPP_NAME: ${{ secrets.WEBAPP_NAME }}
      RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
      IMAGE: "${{ secrets.ACASCALING_API_IMAGE_NAME }}:v1.${{ github.sha }}"

jobs:
  build:
    runs-on: ubuntu-latest    
   
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4  

      - name: Construct image reference
        id: img #id allowing use later in flow
        run: echo "ref=${REGISTRY}/${IMAGE_NAME@L}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT" #prints out and writes image reference to use later. Github repo could contain upper case letters, @L used to force lowercase

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./aca_scaling_api
          push: true
          tags: ${{ steps.img.outputs.ref }} # tags with sha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_GITHUB_OIDC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point Web App at the GHCR image
        run: |
          az webapp config container set \
            --name ${{ secrets.WEBAPP_NAME }} \
            --resource-group "${{ secrets.RESOURCE_GROUP }}" \
            --container-image-name "${{ steps.img.outputs.ref }}"

      - name: Restart Web App
        run: |
          az webapp restart \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP     
